<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Got Cat?</title>
<style>
  :root {
    --bg: #fdf6ec;
    --card: #ffffff;
    --ink: #3a2e2a;
    --accent: #e8863a;
    --accent-dark: #c96f28;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1a17;
      --card: #2b2420;
      --ink: #f0e6dc;
      --accent: #e8863a;
      --accent-dark: #f09a52;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 1.5rem;
    text-align: center;
  }
  h1 { font-size: 2rem; }
  h1 span { color: var(--accent); }
  .frame {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    padding: 12px;
    width: min(480px, 92vw);
  }
  .frame .window {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(128,128,128,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .frame img.ready { display: block; }
  .placeholder { width: 100%; height: 100%; object-fit: cover; }
  .spinner {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    background: rgba(0,0,0,0.25);
  }
  .loading .spinner { display: flex; }
  .loading .spinner .paw { animation: bounce 0.6s ease-in-out infinite alternate; }
  @keyframes bounce { from { transform: translateY(-8px); } to { transform: translateY(8px); } }
  button {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 0.8rem 2.4rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(232,134,58,0.4);
    transition: transform 0.1s, background 0.2s;
  }
  button:hover { background: var(--accent-dark); transform: translateY(-2px); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.6; cursor: wait; transform: none; }
  .counter { opacity: 0.65; font-size: 0.95rem; }
  footer { opacity: 0.5; font-size: 0.8rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
  <h1>Got <span>Cat</span>?</h1>

  <div class="frame">
    <div class="window" id="window">
      <img class="placeholder" id="placeholder"
           src="https://commons.wikimedia.org/wiki/Special:FilePath/Cat_November_2010-1a.jpg?width=800"
           alt="Portrait of a tabby cat">

      <img id="cat" alt="A random cat">
      <div class="spinner"><span class="paw">🐾</span></div>
    </div>
  </div>

  <button id="btn">Got cat? 🐈</button>
  <p class="counter" id="counter"></p>

  <footer>
    Cats brought to you by <a href="https://cataas.com" target="_blank" rel="noopener">cataas.com</a>
    &amp; <a href="https://thecatapi.com" target="_blank" rel="noopener">thecatapi.com</a>.
    Opening photo by Alvesgaspar, CC BY-SA 3.0,
    via <a href="https://commons.wikimedia.org/wiki/File:Cat_November_2010-1a.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>
  </footer>

<script>
  const btn = document.getElementById('btn');
  const img = document.getElementById('cat');
  const win = document.getElementById('window');
  const placeholder = document.getElementById('placeholder');
  const counter = document.getElementById('counter');
  let served = 0;

  // Two independent cat sources; if one fails we try the other.
  const sources = [
    () => `https://cataas.com/cat?width=800&height=800&_=${Date.now()}`,
    async () => {
      const res = await fetch('https://api.thecatapi.com/v1/images/search');
      const data = await res.json();
      return data[0].url;
    }
  ];

  async function fetchCat() {
    btn.disabled = true;
    win.classList.add('loading');

    const order = Math.random() < 0.5 ? [0, 1] : [1, 0];
    for (const i of order) {
      try {
        const url = await sources[i]();
        await loadImage(url);
        placeholder.style.display = 'none';
        img.classList.add('ready');
        served++;
        counter.textContent = `${served} cat${served === 1 ? '' : 's'} met 🐾`;
        break;
      } catch (e) {
        if (i === order[order.length - 1]) {
          counter.textContent = 'The cats are hiding… try again! 🙀';
        }
      }
    }

    win.classList.remove('loading');
    btn.disabled = false;
  }

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const probe = new Image();
      probe.onload = () => { img.src = url; resolve(); };
      probe.onerror = reject;
      probe.src = url;
    });
  }

  btn.addEventListener('click', fetchCat);
  fetchCat(); // serve one on arrival
</script>
</body>
</html>
